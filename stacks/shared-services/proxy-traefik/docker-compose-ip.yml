version: '3.8'

services:
  # The Sidecar: Automatically generates the IP certs into your folder on boot if missing
  cert-generator:
    image: alpine/mkcert:latest
    container_name: ip-cert-generator
    volumes:
      - .:/root/.local/share/mkcert
      - .:/certs
    command: "-cert-file /certs/server-ip.pem -key-file /certs/server-ip-key.pem 123.45.67.89" # <-- Replace with your real public IP

  # The Proxy: Automatically picks up the generated IP certs
  reverse-proxy:
    image: traefik:v3.7
    container_name: global-proxy-ip
    restart: always
    depends_on:
      - cert-generator
    command:
      - "--core.defaultrulesyntax=v2"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.app1-port.address=:8443"
      - "--entrypoints.app2-port.address=:8543"
      - "--providers.file.filename=/etc/traefik/dynamic_conf.yml"
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
      - "8543:8543"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic_conf.yml:/etc/traefik/dynamic_conf.yml:ro
      - .:/etc/traefik/certs:ro
    networks:
      - shared-db-network

networks:
  shared-db-network:
    external: true
    name: shared-db-network
