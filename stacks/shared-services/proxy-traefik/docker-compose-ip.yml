version: '3.8'

services:
  # Sidecar: Generates long-term IP certs into your folder automatically on boot if missing
  cert-generator:
    image: alpine/mkcert:latest
    container_name: ip-cert-generator
    volumes:
      - /app/stacks/shared-services/proxy-traefik/ip:/root/.local/share/mkcert
      - /app/stacks/shared-services/proxy-traefik/ip:/certs
    command: "-cert-file /certs/server-ip.pem -key-file /certs/server-ip-key.pem 123.45.67.89" # <-- Replace with real public IP

  # Proxy: Latest Traefik v3.7 Engine
  reverse-proxy:
    image: traefik:v3.7
    container_name: global-proxy-ip
    restart: always
    depends_on:
      - cert-generator
    command:
      - "--core.defaultrulesyntax=v2"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Multi-app isolated custom ports in Traefik v3.7
      - "--entrypoints.portainer-port.address=:8443"
      - "--entrypoints.laravel-app-bengkel-port.address=:8543"
      # 🚀 The Traefik v3.7 Directory Watcher Fix
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
      - "8543:8543"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount the configuration folder as the dynamic configuration directory
      - /app/stacks/shared-services/proxy-traefik/ip:/etc/traefik/dynamic:ro
      # Mount the folder again so Traefik can read the .pem / .key files
      - /app/stacks/shared-services/proxy-traefik/ip:/etc/traefik/certs:ro
    networks:
      - shared-db-network

networks:
  shared-db-network:
    external: true
    name: shared-db-network
