version: '3.8'

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: global-portainer-prod
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer-data-prod:/data
    networks:
      - shared-db-network
    labels:
      - "traefik.enable=true"
      # Replace with your real live management subdomain:
      - "traefik.http.routers.portainer-prod.rule=Host(`://yourfirm.com`)"
      - "traefik.http.routers.portainer-prod.entrypoints=websecure"
      - "traefik.http.routers.portainer-prod.tls=true"
      - "traefik.http.routers.portainer-prod.tls.certresolver=myresolver"
      - "traefik.http.services.portainer-prod-service.loadbalancer.server.port=9000"

networks:
  shared-db-network:
    external: true
    name: shared-db-network

volumes:
  portainer-data-prod:
