version: '3.8'

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: global-portainer-dev
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer-data-dev:/data
    networks:
      - shared-db-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer-dev.rule=Host(`portainer.mysite.test`)"
      - "traefik.http.routers.portainer-dev.entrypoints=websecure"
      - "traefik.http.routers.portainer-dev.tls=true"
      - "traefik.http.services.portainer-dev-service.loadbalancer.server.port=9000"

networks:
  shared-db-network:
    external: true
    name: shared-db-network

volumes:
  portainer-data-dev:
