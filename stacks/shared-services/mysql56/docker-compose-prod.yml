version: '3.8'

services:
  mysql-proxy:
    image: alpine/socat
    container_name: mysql56-proxy
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    command: tcp-listen:3306,fork,reuseaddr tcp-connect:127.0.0.1:33060
    networks:
      shared-db-network:
        aliases:
          - mysql56-shared

  mysql:
    image: mysql:5.6.43
    container_name: mysql56-shared
    restart: always
    mem_limit: 2g
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
      # MYSQL_ROOT_PASSWORD: your_secure_password
      MYSQL_TCP_PORT: "33060"
    volumes:
      - /app/data/mysql56:/var/lib/mysql
      - ./production.cnf:/tmp/mysql-config/production.cnf:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /tmp/mysql-config/production.cnf /etc/mysql/conf.d/production.cnf
        chmod 0644 /etc/mysql/conf.d/production.cnf
        exec /entrypoint.sh mysqld
    network_mode: "service:mysql-proxy"
    depends_on:
      - mysql-proxy

networks:
  shared-db-network:
    external: true
    name: shared-db-network
