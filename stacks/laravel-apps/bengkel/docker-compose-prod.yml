version: '3.8'

services:
  bengkel-app:
    image: local/php72-debian13:latest
    container_name: bengkel-core-prod
    restart: always
    volumes:
      - /app/htdocs/bengkel:/var/www/html
      - bengkel-vendor-prod:/var/www/html/vendor
      - php-socket-share:/var/run/php
    networks:
      - shared-db-network
      - bengkel-network-prod

  bengkel-web:
    image: nginx:alpine
    container_name: bengkel-webserver-prod
    restart: always
    volumes:
      - /app/htdocs/bengkel:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - php-socket-share:/var/run/php
    networks:
      - shared-db-network
      - bengkel-network-prod
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shared-db-network"
      - "traefik.http.routers.bengkel-prod.rule=Host(`://yourfirm.com`)"  # <-- Replace with your actual live public domain name string
      - "traefik.http.routers.bengkel-prod.entrypoints=websecure"
      - "traefik.http.routers.bengkel-prod.tls=true"
      # References the Let's Encrypt resolver block defined in your production proxy
      - "traefik.http.routers.bengkel-prod.tls.certresolver=myresolver"
      - "traefik.http.services.bengkel-prod-service.loadbalancer.server.port=80"

networks:
  bengkel-network-prod:
  shared-db-network:
    external: true
    name: shared-db-network

volumes:
  bengkel-vendor-prod:
  php-socket-share:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
