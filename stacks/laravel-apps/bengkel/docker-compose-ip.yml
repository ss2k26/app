version: '3.8'

services:
  bengkel-app:
    image: local/php72-debian13:latest
    container_name: bengkel-core-ip
    restart: always
    user: "www"
    volumes:
      - /app/htdocs/bengkel:/var/www/html
      - bengkel-vendor-ip:/var/www/html/vendor
      - php-socket-share:/var/run/php
    networks:
      - shared-db-network
      - bengkel-network-ip

  bengkel-web:
    image: nginx:alpine
    container_name: bengkel-webserver-ip
    restart: always
    volumes:
      - /app/htdocs/bengkel:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - php-socket-share:/var/run/php
    networks:
      - shared-db-network
      - bengkel-network-ip
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bengkel-ip.rule=HostRegexp(`123.45.67.89`)" # <-- Replace with your real public IP
      - "traefik.http.routers.bengkel-ip.entrypoints=laravel-app-bengkel-port" # <-- Replace with your custom port entrypoint
      - "traefik.http.routers.bengkel-ip.tls=true"
      - "traefik.http.services.bengkel-ip-service.loadbalancer.server.port=80"

networks:
  bengkel-network-ip:
  shared-db-network:
    external: true
    name: shared-db-network

volumes:
  bengkel-vendor-ip:
  php-socket-share:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
