server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html;

    # -------------------------------------------------------------
    # REAL IP TRACKING CONFIGURATION
    # -------------------------------------------------------------
    # Extract the real client IP from the header Traefik sends down
    real_ip_header X-Forwarded-For;

    # Trust only the Traefik Docker network
    set_real_ip_from 172.18.0.0/16;

    # Unwraps nested proxy chains if a user passes through multiple hops
    real_ip_recursive on;
    # -------------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass unix:/var/run/php/php5.6-fpm.sock;

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # -------------------------------------------------------------
        # TRUSTED PROXY SIMULATION FOR CORE PHP APPLICATIONS
        # -------------------------------------------------------------
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param SERVER_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        # -------------------------------------------------------------
    }

    # Deny access to hidden system/git files
    location ~ /\.ht {
        deny all;
    }
}
