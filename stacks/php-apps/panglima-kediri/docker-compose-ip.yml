version: '3.8'

services:
  panglima-kediri-app:
    image: local/php56-debian13:latest
    container_name: panglima-kediri-core-ip
    restart: always
    volumes:
      - /app/htdocs/panglima-kediri:/var/www/html
      - php-socket-share:/var/run/php
    networks:
      - shared-db-network
      - panglima-kediri-network-ip

  panglima-kediri-web:
    image: nginx:alpine
    container_name: panglima-kediri-webserver-ip
    restart: always
    volumes:
      - /app/htdocs/panglima-kediri:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - php-socket-share:/var/run/php
    networks:
      - shared-db-network
      - panglima-kediri-network-ip
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shared-db-network"
      - "traefik.http.routers.panglima-kediri-ip.rule=HostRegexp(`123.45.67.89`)" # <-- Replace with your real public IP
      - "traefik.http.routers.panglima-kediri-ip.entrypoints=panglima-kediri-port" # <-- Replace with your custom port entrypoint
      - "traefik.http.routers.panglima-kediri-ip.tls=true"
      - "traefik.http.services.panglima-kediri-ip-service.loadbalancer.server.port=80"

networks:
  panglima-kediri-network-ip:
  shared-db-network:
    external: true
    name: shared-db-network

volumes:
  php-socket-share:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
