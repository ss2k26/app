# Portainer CE behind Traefik. Same file for dev and prod (see .env.*.example).
# Portainer data lives on the HOST at ${APP_ROOT}/data/portainer so that stacks created
# inside Portainer (data/portainer/compose/<id>/) can also be driven with `docker compose`.
name: portainer

services:
  portainer:
    image: portainer/portainer-ce:${PORTAINER_TAG:-lts}
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_ROOT:-/app}/data/portainer:/data
    ports:
      # break-glass access if Traefik is down / SSH tunnel on a VPS: https://127.0.0.1:9443
      - "${PORTAINER_BIND:-127.0.0.1}:9443:9443"
    networks:
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.services.portainer.loadbalancer.server.port=9443"
      - "traefik.http.services.portainer.loadbalancer.server.scheme=https"
      - "traefik.http.services.portainer.loadbalancer.serversTransport=insecure@file"
      # A) dev: https://portainer.mysite.test  (default store cert = mkcert wildcard)
      - "traefik.http.routers.portainer-dev.rule=Host(`${PORTAINER_HOST_DEV:-disabled.invalid}`)"
      - "traefik.http.routers.portainer-dev.entrypoints=websecure"
      - "traefik.http.routers.portainer-dev.tls=true"
      # B) prod domain: Let's Encrypt (set PORTAINER_HOST_PROD + ACME_RESOLVER=le)
      - "traefik.http.routers.portainer-prod.rule=Host(`${PORTAINER_HOST_PROD:-disabled.invalid}`)"
      - "traefik.http.routers.portainer-prod.entrypoints=websecure"
      - "traefik.http.routers.portainer-prod.tls=true"
      - "traefik.http.routers.portainer-prod.tls.certresolver=${ACME_RESOLVER:-}"
      # C) IP + custom port: https://<ip>:8443  (set PORTAINER_IP_HOST + PORTAINER_IP_EP=ip-8443)
      - "traefik.http.routers.portainer-ip.rule=Host(`${PORTAINER_IP_HOST:-disabled.invalid}`)"
      - "traefik.http.routers.portainer-ip.entrypoints=${PORTAINER_IP_EP:-websecure}"
      - "traefik.http.routers.portainer-ip.tls=true"

networks:
  edge:
    external: true
    name: edge
